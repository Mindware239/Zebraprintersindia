server {
    listen 80;
    server_name _;
    
    # Serve static files directly from dist directory
    root /usr/share/nginx/html/dist;
    index index.html;
    
    # Handle static assets with proper caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # API requests - proxy to Node.js server
    location /api/ {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Health check endpoint - proxy to Node.js
    location /health {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    # Admin routes - proxy to Node.js
    location /admin {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    # All other requests - serve from dist with SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Used by Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/;
    }

    # Used by CapRover for health check
    location /.well-known/captain-identifier {
        root /usr/share/nginx/html/;
    }
}
